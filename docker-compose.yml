services:
  db:
    image: postgres:16-alpine
    container_name: flowdow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-flowdow}
      POSTGRES_USER: ${DB_USER:-flowdow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flowdow_secure_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-flowdow} -d ${DB_NAME:-flowdow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowdow-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media_data:/app/media
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  postgres_data:
    driver: local
  media_data:
    driver: local

